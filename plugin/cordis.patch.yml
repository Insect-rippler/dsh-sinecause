# ============================================================================
# dsh-sinecause —— bundle 自带的挂载声明
# ============================================================================
# profile 只要在 `dsh.profile.bundles` 里列出本包名即生效，不必手改 profile 的
# cordis.patch.yml —— 那个文件会被插件安装重写，写进去的行会丢。
#
# 这里**不写任何绝对路径**：工作区默认取包的上一级目录，状态文件默认放在
# <workspace>/state/ 下。所以：
#   - link: 安装时（包就在工作区里）零配置即可；
#   - file: 安装时包被复制进 node_modules，默认解析会直接报错，
#     这时必须显式写 workspaceRoot，或设环境变量 SINECAUSE_WORKSPACE。
#
# 三个插件都按 cwd 过滤：只有会话工作目录落在 workspaceRoot 下才注册工具与注入。
# ============================================================================

- insert:
    # 人格：系统提示最前面（order 1，紧跟宿主的空人格槽），先于一切策略与工具说明。
    # 内容是 <workspace>/state/persona.md，文件不存在就什么都不注入。
    - id: sinecause-persona
      name: 'dsh-sinecause/persona'

    - id: sinecause-goal
      name: 'dsh-sinecause'

    - id: sinecause-memory
      name: 'dsh-sinecause/memory'

    # 时钟：没人在说话时按间隔叫醒她。
    # 现在是快速迭代期，10 分钟。稳定之后改成 30（中等）或 60。
    - id: sinecause-clock
      name: 'dsh-sinecause/clock'
      config:
        intervalMinutes: 10

    # 单向下通知：把值得说的一句推给他（飞书群机器人）。
    # webhook 地址是凭据，写在 <workspace>/state/notify.json 里，不进这个文件。
    - id: sinecause-notify
      name: 'dsh-sinecause/notify'

    # 调试：把每次请求的完整 payload 落一份到 state/last-request.md。
    # 平时关着；要看时在 state/ 里放一个 dump-prompt.on 文件即可，不用重启。
    - id: sinecause-promptdump
      name: 'dsh-sinecause/promptdump'
